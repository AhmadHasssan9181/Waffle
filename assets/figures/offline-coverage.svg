      <circle cx="24" cy="22" r="4.5" fill="#0D9488"/>
      <text x="38" y="27" class="title" font-size="14" fill="#0F172A">Pakistan National Overview</text>
      <rect x="275" y="15" width="160" height="14" rx="7" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.2"/>
