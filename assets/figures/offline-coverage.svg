  <!-- Right Side: Offline Pack Architecture Card -->
  <g transform="translate(816, 82)" filter="url(#cov-shadow)">
    <rect width="340" height="310" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
    <rect x="0" y="0" width="340" height="42" rx="14" fill="#B45309"/>
    <rect x="0" y="22" width="340" height="20" fill="#B45309"/>
    <text x="20" y="26" class="mono" font-size="11.5" fill="#FFFBEB">PACK ENGINE ARCHITECTURE</text>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
      <text x="16" y="24" class="title" font-size="14" fill="#0F172A">Throttled Download Worker</text>
      <text x="16" y="43" class="sans" font-size="11.5" fill="#78350F">Paces tile requests to respect MapTiler</text>
      <text x="16" y="58" class="mono" font-size="10.5" fill="#B45309">rate limits &amp; honors system proxy</text>

      <rect x="0" y="82" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
      <text x="16" y="106" class="title" font-size="14" fill="#0F172A">HTTP 429 Style Recovery</text>
      <text x="16" y="125" class="sans" font-size="11.5" fill="#78350F">Automatically mounts completed local</text>
      <text x="16" y="140" class="mono" font-size="10.5" fill="#B45309">basemap if online style is rejected</text>

      <rect x="0" y="164" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
      <text x="16" y="188" class="title" font-size="14" fill="#0F172A">Zero-GPS Pack Centering</text>
      <text x="16" y="207" class="sans" font-size="11.5" fill="#334155">Centers camera on downloaded region</text>
      <text x="16" y="222" class="mono" font-size="10.5" fill="#0F766E">even before first GPS fix locks</text>
