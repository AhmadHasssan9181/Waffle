      <rect x="492" y="11" width="88" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/>
      <text x="536" y="26" text-anchor="middle" class="mono" font-size="10.5" fill="#15803D">CACHED GL</text>
      <rect x="610" y="11" width="122" height="22" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
      <text x="671" y="26" text-anchor="middle" class="mono" font-size="10.5" fill="#475569">ONLINE ORS</text>
