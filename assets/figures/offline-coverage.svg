      <text x="355" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#0F172A">z5 – z9 BASEMAP</text>
      <rect x="492" y="11" width="88" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/>
