<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%">
  <defs>
    <radialGradient id="arch-bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="55%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#F2E6CE"/>
    </radialGradient>
    <pattern id="arch-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#78350F" opacity="0.08"/>
    </pattern>
    <filter id="arch-shadow" x="-5%" y="-5%" width="112%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="16" fill="url(#arch-bg)"/>
  <rect width="1200" height="460" rx="16" fill="url(#arch-dots)"/>

  <!-- Header -->
  <g transform="translate(44, 34)">
    <rect x="0" y="0" width="184" height="26" rx="6" fill="#F59E0B" fill-opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="14" cy="13" r="4" fill="#D97706"/>
    <text x="26" y="17" class="mono" font-size="11" letter-spacing="1.2" fill="#92400E">FIG 04 // ARCHITECTURE</text>
    <text x="202" y="18" class="title" font-size="19" fill="#0F172A">Unidirectional StateFlow &amp; App-Scoped Navigation Session</text>
    <text x="1112" y="17" text-anchor="end" class="mono" font-size="11" fill="#78350F" opacity="0.8">MVVM · UDF · COMPOSE</text>
  </g>

  <!-- Vertical Connectors -->
  <g stroke="#0F172A" stroke-width="2.5" stroke-dasharray="5 4">
    <line x1="150" y1="164" x2="150" y2="202"/>
    <line x1="375" y1="164" x2="375" y2="202"/>
    <line x1="600" y1="164" x2="600" y2="202"/>
    <line x1="825" y1="164" x2="825" y2="202"/>
    <line x1="1050" y1="164" x2="1050" y2="202"/>

    <line x1="180" y1="274" x2="180" y2="310"/>
    <line x1="460" y1="274" x2="460" y2="310"/>
    <line x1="740" y1="274" x2="740" y2="310"/>
    <line x1="1020" y1="274" x2="1020" y2="310"/>
  </g>

  <!-- LAYER 1: JETPACK COMPOSE UI SURFACES -->
  <g transform="translate(44, 82)" filter="url(#arch-shadow)">
    <g transform="translate(0, 0)">
      <rect width="206" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="68" height="18" rx="4" fill="#FEF3C7"/>
      <text x="48" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#92400E">SURFACE 01</text>
      <text x="14" y="50" class="title" font-size="14.5" fill="#0F172A">Command Home</text>
      <text x="14" y="68" class="sans" font-size="11" fill="#475569">Weather · Nearest Alert</text>
    </g>
    <g transform="translate(226, 0)">
      <rect width="206" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="68" height="18" rx="4" fill="#E0F2FE"/>
      <text x="48" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#0369A1">SURFACE 02</text>
      <text x="14" y="50" class="title" font-size="14.5" fill="#0F172A">Navigation HUD</text>
      <text x="14" y="68" class="sans" font-size="11" fill="#475569">3D Vehicle · Lanes · ETA</text>
    </g>
    <g transform="translate(453, 0)">
      <rect width="206" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="68" height="18" rx="4" fill="#CCFBF1"/>
      <text x="48" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#0F766E">SURFACE 03</text>
      <text x="14" y="50" class="title" font-size="14.5" fill="#0F172A">Floating Map / PiP</text>
      <text x="14" y="68" class="sans" font-size="11" fill="#475569">System Overlay Window</text>
    </g>
    <g transform="translate(680, 0)">
      <rect width="206" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="68" height="18" rx="4" fill="#FEE2E2"/>
      <text x="48" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#B91C1C">SURFACE 04</text>
      <text x="14" y="50" class="title" font-size="14.5" fill="#0F172A">Alerts &amp; Rescue</text>
      <text x="14" y="68" class="sans" font-size="11" fill="#475569">Hazard Zones · SOS Fix</text>
    </g>
    <g transform="translate(906, 0)">
      <rect width="206" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="68" height="18" rx="4" fill="#F1F5F9"/>
      <text x="48" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#334155">SURFACE 05</text>
      <text x="14" y="50" class="title" font-size="14.5" fill="#0F172A">Nearby &amp; Packs</text>
      <text x="14" y="68" class="sans" font-size="11" fill="#475569">Fuel · Food · Offline Maps</text>
    </g>
  </g>

  <!-- LAYER 2: APP-SCOPED SESSION BUS -->
  <g transform="translate(44, 202)" filter="url(#arch-shadow)">
    <rect width="1112" height="72" rx="14" fill="#0F172A" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="20" y="18" width="164" height="36" rx="8" fill="#F59E0B"/>
    <text x="102" y="41" text-anchor="middle" class="mono" font-size="12.5" fill="#0F172A">MapSessionState</text>
    <text x="206" y="34" class="title" font-size="16" fill="#F8FAFC">App-Scoped Navigation &amp; Telemetry Coordinator (Kotlin Coroutines + StateFlow)</text>
    <text x="206" y="54" class="mono" font-size="11.5" fill="#38BDF8">Active Polyline · Vehicle Pose · Simulator Clock · Audio Focus · Saved-Trip Recovery</text>
  </g>

  <!-- LAYER 3: CORE SUBSYSTEM ENGINES -->
  <g transform="translate(44, 310)" filter="url(#arch-shadow)">
    <!-- Engine 1 -->
    <g transform="translate(0, 0)">
      <rect width="262" height="110" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#0284C7"/>
      <rect x="0" y="16" width="262" height="16" fill="#0284C7"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#F0F9FF">MAPLIBRE NATIVE GL</text>
      <text x="16" y="56" class="title" font-size="13.5" fill="#0F172A">Vector &amp; Pack Renderer</text>
      <text x="16" y="75" class="sans" font-size="11.5" fill="#475569">3D vehicle layers, route casing,</text>
      <text x="16" y="92" class="mono" font-size="10.5" fill="#0369A1">hazard radii &amp; style fallback</text>
    </g>

    <!-- Engine 2 -->
    <g transform="translate(283, 0)">
      <rect width="262" height="110" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#D97706"/>
      <rect x="0" y="16" width="262" height="16" fill="#D97706"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#FFFBEB">ROUTING &amp; GEOCODING</text>
      <text x="16" y="56" class="title" font-size="13.5" fill="#0F172A">GraphHopper + ORS</text>
      <text x="16" y="75" class="sans" font-size="11.5" fill="#475569">Offline road graph, OpenCage,</text>
      <text x="16" y="92" class="mono" font-size="10.5" fill="#B45309">Nominatim &amp; local landmark index</text>
    </g>

    <!-- Engine 3 -->
    <g transform="translate(566, 0)">
      <rect width="262" height="110" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#0D9488"/>
      <rect x="0" y="16" width="262" height="16" fill="#0D9488"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#F0FDFA">FIELD INTELLIGENCE</text>
      <text x="16" y="56" class="title" font-size="13.5" fill="#0F172A">USGS · GDACS · Weather</text>
      <text x="16" y="75" class="sans" font-size="11.5" fill="#475569">Seismic/disaster telemetry feeds,</text>
      <text x="16" y="92" class="mono" font-size="10.5" fill="#0F766E">Firestore alerts &amp; Fused GPS</text>
    </g>

    <!-- Engine 4 -->
    <g transform="translate(850, 0)">
      <rect width="262" height="110" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#334155"/>
      <rect x="0" y="16" width="262" height="16" fill="#334155"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#F8FAFC">PERSISTENCE &amp; WORKERS</text>
      <text x="16" y="56" class="title" font-size="13.5" fill="#0F172A">Room · DataStore · TTS</text>
      <text x="16" y="75" class="sans" font-size="11.5" fill="#475569">Resumable WorkManager packs,</text>
      <text x="16" y="92" class="mono" font-size="10.5" fill="#334155">DB migrations &amp; voice prompts</text>
    </g>
  </g>

  <rect x="3" y="3" width="1194" height="454" rx="14" fill="none" stroke="#0F172A" stroke-width="4"/>
</svg>

